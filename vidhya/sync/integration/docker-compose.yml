# Integration stack for the brain-integration job (plan T21, R11) and for local
# runs of the S1-S3 spikes. Nothing under upstream/ is modified: this file only
# pins the DeepTutor image and supplies its data volume.
#
# DeepTutor is pinned by DIGEST. The image's /app/deeptutor tree was verified
# byte-identical to upstream/deeptutor/deeptutor (v1.7.3) on 24 Nov 2026;
# integration/verify-image-pin.sh re-checks that on every run, so a retagged
# image or a bumped upstream/ cannot drift apart unnoticed.
#
# Usage (from this directory):
#   ./up.sh            # prepares $DT_DATA (outside the repo), starts the stack, creates the admin + test student
#   ./down.sh
#
# Ports bind to loopback only. The sandbox-runner and PocketBase sidecars of
# upstream's docker-compose.yml are not started: S3 needs neither, and no
# tutor-side code execution runs here.
name: vidhya-it
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [dt]

  deeptutor:
    image: ghcr.io/hkuds/deeptutor@sha256:dff6d6ef37bcb433e67addb2cc6fd06e9b504f6acfe66e91a1162c1b0d1ee801
    container_name: vidhya-it-deeptutor
    ports:
      - "127.0.0.1:${DT_BACKEND_PORT:-8001}:8001"
      - "127.0.0.1:${DT_FRONTEND_PORT:-3782}:3782"
    volumes:
      - "${DT_DATA:-/tmp/vidhya-it/data}:/app/data"
      - "${VIDHYA_SYNC_DIR:-..}:/vidhya-sync:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    networks: [dt]

  # The real brain, built from vidhya/brain with a SYNTHETIC pack (fixtures/brain-pack), so the sync
  # command's /v1/servable can be exercised end to end. Migration is its own one-shot step (E13); the
  # server refuses to start on an old schema. Reachable on loopback only. The sync command reads
  #   VIDHYA_BRAIN_URL=http://127.0.0.1:${BRAIN_PORT:-8080}  VIDHYA_BRAIN_TOKEN=$SYNC_TOKEN
  # (the container sees a private bridge address, which /v1/servable accepts; there is no proxy header).
  brain-migrate:
    build: { context: ../.., dockerfile: brain/Dockerfile }
    image: vidhya-it-brain
    pull_policy: build
    command: ["node", "dist/brain/src/cli/vidhya.js", "migrate", "/data/brain.db", "/data/backups"]
    volumes:
      - "${BRAIN_DATA:-/tmp/vidhya-it/brain}:/data"
    networks: [dt]

  brain:
    image: vidhya-it-brain
    pull_policy: never   # built by brain-migrate above; never pulled
    container_name: vidhya-it-brain
    depends_on:
      brain-migrate:
        condition: service_completed_successfully
      deeptutor:
        condition: service_healthy
    environment:
      VIDHYA_DB: /data/brain.db
      PACK_DIR: /pack
      DEEPTUTOR_URL: http://deeptutor:8001
      VIDHYA_HASH_SALT: it-synthetic-salt
      APP_ORIGIN: http://127.0.0.1:${BRAIN_PORT:-8080}
      SYNC_TOKEN: ${SYNC_TOKEN:-it-sync-token-synthetic}
      BUILD_ID: it
      HOST: 0.0.0.0
      PORT: "8080"
    volumes:
      - "${BRAIN_DATA:-/tmp/vidhya-it/brain}:/data"
      - "./fixtures/brain-pack:/pack:ro"
    ports:
      - "127.0.0.1:${BRAIN_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [dt]

networks:
  dt:
    driver: bridge
